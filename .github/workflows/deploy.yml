name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        env:
          REACT_APP_HIGH_SCORE_API_ENDPOINT: ${{ secrets.HIGH_SCORE_API_ENDPOINT }}
          REACT_APP_HIGH_SCORE_API_KEY: ${{ secrets.HIGH_SCORE_API_KEY }}
          REACT_APP_LIKE_API_ENDPOINT: ${{ secrets.LIKE_API_ENDPOINT }}
          REACT_APP_LIKE_API_KEY: ${{ secrets.LIKE_API_KEY }}
          REACT_APP_FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          REACT_APP_CAPTCHA_SITEKEY: ${{ secrets.CAPTCHA_SITEKEY }}
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
